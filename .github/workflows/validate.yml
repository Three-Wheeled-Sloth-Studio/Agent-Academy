name: Validate Agent Academy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install pyyaml
      - name: Compile tools
        run: python -m py_compile refs/tools/*.py
      - name: Check generated OKF indexes
        run: python refs/tools/generate_okf_indexes.py --check
      - name: Validate blank harness
        run: python refs/tools/validate_refs.py --mode template
      - name: Validate bounded agent re-entry packet
        run: python refs/tools/generate_agent_context.py --check
